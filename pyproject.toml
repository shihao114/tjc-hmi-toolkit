[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tjc-hmi-toolkit"
version = "0.1.0"
description = "Template-based inspection and generation of TJC HMI projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
tjc-hmi = "tjc_hmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

